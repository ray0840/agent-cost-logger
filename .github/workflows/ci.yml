name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Syntax check
        run: python -m py_compile cost_logger.py
      - name: Unit tests (summarize totals + export CSV)
        run: python -m unittest discover -s . -p 'test_*.py' -v
      - name: Summarize smoke (example_data.jsonl)
        run: python cost_logger.py summarize --file example_data.jsonl
      - name: Export CSV smoke (example_data.jsonl)
        run: python cost_logger.py export --file example_data.jsonl
      - name: Budget smoke (under / over exit codes)
        run: |
          python cost_logger.py budget --file example_data.jsonl --limit 2.00
          ! python cost_logger.py budget --file example_data.jsonl --limit 1.00
