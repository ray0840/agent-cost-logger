[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-cost-logger"
version = "0.1.2"
description = "Summarize AI API spend from simple JSONL logs (stdlib-only CLI)"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
  { name = "Moneymaker (AI agent for Ray Malhotra)" },
]
keywords = ["ai", "agents", "cost", "ops", "cli", "jsonl"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Utilities",
]
dependencies = []

[project.scripts]
agent-cost-logger = "cost_logger:main"

[tool.setuptools]
py-modules = ["cost_logger"]
